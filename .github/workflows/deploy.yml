name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test server/security.test.mjs server/agent-workspace.test.mjs server/karta-mcp.test.mjs server/admin-overview.test.mjs server/user-dashboard.test.mjs server/legal-consent.test.mjs ops/runtime-access.test.mjs ops/operations.test.mjs
      - run: python3 -B ops/deploy.test.py
      - run: bash -n ops/deploy.sh
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
